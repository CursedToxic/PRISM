<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRISM — HSC Software Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.294.0/dist/umd/lucide.min.js"></script>
<style>
/* ============ MATERIAL TOKENS ============ */
body.day{
  --bg:#EAE9E4; --ink:#1E2422; --ink2:#5C6663; --mut:#8B948F;
  --glass:rgba(255,255,255,.55); --flat:rgba(255,255,255,.5); --line:rgba(30,40,38,.10); --line2:rgba(30,40,38,.16);
  --edge:rgba(255,255,255,.85); --rim-hi:rgba(255,255,255,.95); --rim-lo:rgba(70,62,45,.22); --sh:.16;
  --acc:#0E8A68; --acc-ink:#F1FFFA; --bad:#C2402F; --warn:#94650A;
}
body.night{
  --bg:#07090B; --ink:#E8F1EC; --ink2:#8FA69C; --mut:#5E7169;
  --glass:rgba(17,23,27,.58); --flat:rgba(255,255,255,.05); --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.15);
  --edge:rgba(255,255,255,.14); --rim-hi:rgba(255,255,255,.32); --rim-lo:rgba(255,255,255,.09); --sh:.5;
  --acc:#00E5A0; --acc-ink:#04140D; --bad:#FF4D6E; --warn:#FFB43D;
}
:root{ --fd:'Sora',sans-serif; --fm:'JetBrains Mono',monospace;
  --well:#0C1110; --well-line:rgba(255,255,255,.09); --well-ink:#D9E7E1;
  --tkw:#37E39B; --tks:#E5C288; --tkn:#7FD9C4; --tkc:#5E7069; }
*{box-sizing:border-box; margin:0; padding:0}
body{font:400 14px/1.65 var(--fd); background:var(--bg); color:var(--ink); min-height:100vh; overflow-x:hidden}
::selection{background:var(--acc); color:var(--acc-ink)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px}
button{font-family:var(--fd)}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px}

/* ============ AMBIENT LIGHT ============ */
#ambient{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.orbs{position:absolute; inset:-12%; transition:opacity .85s ease}
.orbs i{position:absolute; border-radius:50%; filter:blur(90px)}
.orbs.day i:nth-child(1){width:58vw;height:58vw;left:-12%;top:-22%;background:radial-gradient(circle,rgba(255,186,118,.55),transparent 70%)}
.orbs.day i:nth-child(2){width:48vw;height:48vw;right:-14%;top:8%;background:radial-gradient(circle,rgba(118,214,186,.5),transparent 70%)}
.orbs.day i:nth-child(3){width:52vw;height:52vw;left:22%;bottom:-26%;background:radial-gradient(circle,rgba(255,226,150,.45),transparent 70%)}
.orbs.night i:nth-child(1){width:56vw;height:56vw;left:-12%;top:-18%;background:radial-gradient(circle,rgba(0,229,160,.20),transparent 70%)}
.orbs.night i:nth-child(2){width:46vw;height:46vw;right:-10%;top:12%;background:radial-gradient(circle,rgba(255,61,138,.16),transparent 70%)}
.orbs.night i:nth-child(3){width:50vw;height:50vw;left:28%;bottom:-28%;background:radial-gradient(circle,rgba(255,180,61,.13),transparent 70%)}
body.day .orbs.night{opacity:0}
body.night .orbs.day{opacity:0}

/* ============ GLASS ============ */
.g{position:relative; background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(160%); backdrop-filter:blur(26px) saturate(160%);
  border-radius:26px;
  box-shadow:0 24px 60px -22px rgba(0,0,0,calc(var(--sh)*1.15)), inset 0 1px 0 var(--edge)}
.g::after{content:""; position:absolute; inset:0; border-radius:inherit; padding:1.5px;
  background:linear-gradient(165deg,var(--rim-hi) 0%,rgba(255,255,255,0) 34%,rgba(255,255,255,0) 62%,var(--rim-lo) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite:exclude;
  pointer-events:none}
.gf{background:var(--flat); border:1px solid var(--line); border-radius:18px}
.well{background:var(--well); border:1px solid var(--well-line); border-radius:18px; color:var(--well-ink)}
.gpad{padding:20px 22px}

/* ============ SPLASH (CSS-only dismissal) ============ */
#splash{position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; align-items:center;
  justify-content:center; flex-direction:column; gap:14px; cursor:pointer;
  animation:splashHide .55s ease 1.45s forwards}
@keyframes splashHide{to{opacity:0; visibility:hidden}}
.sp-word{font:800 clamp(34px,7vw,56px) var(--fd); letter-spacing:.32em; text-indent:.32em; position:relative; overflow:hidden}
.sp-word::after{content:''; position:absolute; top:0; left:-60%; width:45%; height:100%; transform:skewX(-16deg);
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--acc) 55%,transparent),transparent);
  animation:sweep 1s ease both}
@keyframes sweep{to{left:120%}}
.sp-sub{font:600 9px var(--fm); letter-spacing:.4em; color:var(--mut); text-indent:.4em}
.sp-mark{width:52px; height:52px; border-radius:50%; border:1px solid var(--line2); display:flex;
  align-items:center; justify-content:center; color:var(--acc)}
.sp-mark svg{width:24px; height:24px}

/* ============ CHROME ============ */
#bar{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:30;
  width:min(1120px,calc(100% - 28px)); display:flex; align-items:center; gap:12px; padding:9px 16px; border-radius:999px}
.mark{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--flat);color:var(--acc);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.mark svg{width:17px;height:17px}
.bar-t{display:flex;flex-direction:column;line-height:1.15;margin-left:2px;min-width:0}
.bar-k{font:600 8.5px var(--fm); letter-spacing:.22em; color:var(--mut); white-space:nowrap}
.bar-n{font:700 14px var(--fd); letter-spacing:.01em; white-space:nowrap; overflow:hidden;text-overflow:ellipsis}
.bar-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--flat);color:var(--ink2);
  border-radius:999px;padding:7px 12px;cursor:pointer;font:600 10.5px var(--fm);letter-spacing:.08em;transition:.18s}
.pill:hover{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.pill svg{width:14px;height:14px}
.xpcap{display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);background:var(--flat);
  border-radius:999px;padding:7px 14px;cursor:default}
.xp-n{font:700 13px var(--fd); color:var(--acc)}
.xp-r{font:600 8.5px var(--fm); letter-spacing:.14em; color:var(--mut)}
.sdot{width:5px;height:5px;border-radius:50%;background:var(--mut);align-self:center;transition:.3s}
.sdot.busy{background:var(--acc)}
.yswitch{position:relative;display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;flex-shrink:0}
.yswitch .thumb{position:absolute;top:3px;left:3px;width:44px;height:calc(100% - 6px);border-radius:999px;
  background:var(--acc);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);transition:transform .38s cubic-bezier(.54,1.35,.5,1)}
body.night .yswitch .thumb{transform:translateX(44px)}
.yswitch button{position:relative;z-index:1;width:44px;border:0;background:none;font:600 10px var(--fm);
  letter-spacing:.1em;padding:6px 0;color:var(--ink2);cursor:pointer;border-radius:999px}
.yswitch button.on{color:var(--acc-ink)}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;
  display:flex;gap:2px;padding:8px 12px;border-radius:999px}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:3px;width:56px;padding:7px 0;border-radius:16px;
  background:none;border:0;color:var(--ink2);cursor:pointer;transition:background .2s,color .2s}
.dbtn svg{width:20px;height:20px;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.dbtn:hover svg{transform:scale(1.22) translateY(-3px)}
.d-l{font:600 8px var(--fm);letter-spacing:.08em}
.dbtn.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,transparent)}
.dbtn.lk{opacity:.38}

/* ============ LAYOUT ============ */
.wrap{max-width:1120px;margin:0 auto;padding:96px 20px 132px;position:relative;z-index:1;min-height:70vh}
.vwrap{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.vhead{margin:6px 0 18px}
.v-kick{font:600 9.5px var(--fm);letter-spacing:.26em;color:var(--mut)}
.v-title{font:700 clamp(24px,3.6vw,32px)/1.2 var(--fd);letter-spacing:-.01em;margin-top:4px}
.sec-h{display:flex;align-items:center;gap:8px;font:600 10px var(--fm);letter-spacing:.2em;color:var(--ink2);
  text-transform:uppercase;margin-bottom:12px}
.sec-h::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--acc)}
.sec-h .rt{margin-left:auto;font:600 9px var(--fm);letter-spacing:.12em;color:var(--mut);display:flex;gap:8px;align-items:center}

/* ============ CONTROLS ============ */
.btn{font:600 10.5px var(--fm);letter-spacing:.12em;text-transform:uppercase;padding:10px 17px;border-radius:999px;
  border:1px solid var(--line);background:var(--flat);color:var(--ink);cursor:pointer;display:inline-flex;
  align-items:center;gap:7px;transition:.18s}
.btn svg{width:13px;height:13px}
.btn:hover{border-color:color-mix(in srgb,var(--acc) 50%,var(--line));color:var(--acc)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-acc{background:var(--acc);border-color:transparent;color:var(--acc-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 28px -12px color-mix(in srgb,var(--acc) 55%,transparent)}
.btn-acc:hover{color:var(--acc-ink);filter:brightness(1.07)}
.btn-sm{padding:6px 11px;font-size:9.5px}
.btn-bad:hover{border-color:var(--bad);color:var(--bad)}
.chip{font:600 9px var(--fm);letter-spacing:.1em;border:1px solid var(--line2);color:var(--ink2);
  padding:3px 9px;border-radius:999px;text-transform:uppercase}
.chip-acc{border-color:color-mix(in srgb,var(--acc) 55%,transparent);color:var(--acc)}
.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.tin,.tsel,.tta{background:var(--flat);border:1px solid var(--line);color:var(--ink);font:400 13.5px var(--fd);
  padding:10px 12px;outline:none;border-radius:13px;width:100%}
.tin:focus,.tsel:focus,.tta:focus{border-color:var(--acc)}
.flabel{font:600 9px var(--fm);letter-spacing:.18em;color:var(--mut);text-transform:uppercase;display:block;margin:12px 0 5px}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.frow>div{flex:1;min-width:130px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--flat)}
.seg button{border:0;background:none;color:var(--ink2);font:600 10px var(--fm);letter-spacing:.1em;
  padding:7px 14px;cursor:pointer;border-radius:999px}
.seg button.on{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.empty{padding:26px;text-align:center;color:var(--mut);font-size:12.5px}

/* ============ DECK ============ */
.dgrid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.hero-in{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ringwrap{position:relative;flex-shrink:0;width:116px;height:116px}
.ring-c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ring-xp{font:800 16px var(--fd);color:var(--ink)}
.hi-rank{font:700 15px var(--fd);color:var(--acc);letter-spacing:.02em}
.hi-sub{color:var(--ink2);font-size:12px;margin:3px 0 12px}
.stat-row{display:flex;gap:16px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font:700 17px var(--fd)}
.stat span{font:600 8.5px var(--fm);letter-spacing:.14em;color:var(--mut)}
.obj-title{font:700 19px var(--fd);margin:6px 0}
.obj-tag{color:var(--ink2);font-size:12.5px}
.mm-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:11px}
.mm-row:last-child{border:0}
.mm-code{color:var(--acc);font:600 9.5px var(--fm);letter-spacing:.08em;width:70px;flex-shrink:0}
.mm-bar{flex:1}
.mm-pct{width:38px;text-align:right;color:var(--mut);font:600 9.5px var(--fm)}
.feed-line{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.feed-line:last-child{border:0}
.feed-who{color:var(--acc);font-weight:600}
.lens-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lens-sw{width:15px;height:15px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.lens-nm{flex:1;font:600 11px var(--fm);letter-spacing:.1em}

/* ============ SYLLABUS ============ */
.sy-grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.mod-row{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s;border-radius:14px}
.mod-row:hover{background:var(--flat)}
.mod-row.on{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.mod-code{font:600 9.5px var(--fm);color:var(--acc);letter-spacing:.12em}
.mod-title{font:600 13.5px var(--fd);margin:2px 0}
.mod-mast{font:600 9px var(--fm);color:var(--mut);letter-spacing:.08em}
.dot-row{padding:6px 16px 6px 26px;border-radius:10px;cursor:pointer;font:500 11px var(--fm);color:var(--ink2);
  display:flex;gap:8px;align-items:center}
.dot-row:hover{color:var(--ink)}
.dot-row.on{color:var(--acc)}
.dot-st{width:6px;height:6px;border-radius:50%;background:var(--line2);flex-shrink:0}
.dot-st.s-ok{background:var(--acc)} .dot-st.s-warn{background:var(--warn)} .dot-st.s-bad{background:var(--bad)}
.sy-text{font:600 17px/1.45 var(--fd);margin:4px 0 12px}
.note-li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.6}
.note-li:last-child{border:0}
.note-li::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--acc);flex-shrink:0;margin-top:7px}

/* ============ EDITOR / WELLS ============ */
.editor{display:flex;border:1px solid var(--well-line);background:var(--well);border-radius:18px;overflow:hidden}
.ed-gutter{width:44px;padding:14px 8px 14px 0;text-align:center;color:#4A5B54;font:12px/1.7 var(--fm);
  overflow:hidden;user-select:none;border-right:1px solid var(--well-line);flex-shrink:0}
.ed-body{position:relative;flex:1;height:340px}
.ed-body.ed-s{height:230px}
.ed-hl,.ed-ta{position:absolute;inset:0;margin:0;padding:14px;font:13px/1.7 var(--fm);white-space:pre;overflow:auto;tab-size:2}
.ed-hl{pointer-events:none;overflow:hidden;color:var(--well-ink)}
.ed-ta{background:transparent;color:transparent;caret-color:var(--tkw);border:0;outline:none;resize:none}
.tk-kw{color:var(--tkw);font-weight:600}.tk-str{color:var(--tks)}.tk-num{color:var(--tkn)}.tk-com{color:var(--tkc)}
.codeblock{background:var(--well);border:1px solid var(--well-line);border-radius:16px;padding:15px;
  font:12.5px/1.7 var(--fm);overflow-x:auto;white-space:pre;color:var(--well-ink)}
.logblock{background:var(--well);border:1px solid var(--well-line);border-radius:16px;padding:15px;
  font:12px/1.8 var(--fm);overflow-x:auto;white-space:pre;color:#8FE8C4}
.term-h{padding:10px 14px;border-bottom:1px solid var(--well-line);font:600 9.5px var(--fm);letter-spacing:.2em;color:#5E7069;display:flex;justify-content:space-between}
.term-b{padding:14px;min-height:340px;max-height:430px;overflow-y:auto;font:12.5px/1.75 var(--fm)}
.tl{white-space:pre-wrap;word-break:break-word}
.tl.dim{color:#5E7069}.tl.err{color:#FF8098}.tl.sys{color:var(--tkw)}
.snip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.snip{font:600 9.5px var(--fm);letter-spacing:.1em;border:1px dashed var(--line2);color:var(--ink2);
  background:none;padding:7px 12px;cursor:pointer;border-radius:999px;transition:.15s}
.snip:hover{color:var(--acc);border-color:var(--acc)}
.sb-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}

/* ============ EXAM ============ */
.q-dots{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.q-prompt{font:600 15.5px/1.5 var(--fd);margin-bottom:16px}
.opt{display:flex;gap:12px;padding:13px 16px;border:1px solid var(--line);background:var(--flat);cursor:pointer;
  font-size:13px;margin-bottom:9px;border-radius:15px;transition:.15s;align-items:baseline}
.opt:hover{border-color:var(--line2);background:color-mix(in srgb,var(--acc) 7%,transparent)}
.opt.sel{border-color:var(--acc)}
.opt.ok{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt .ol{color:var(--mut);font:700 11px var(--fm)}
#ex-body.locked .opt,#ex-body.locked .dg-node{pointer-events:none}
.explain{border-left:3px solid var(--acc);padding:12px 15px;margin-top:14px;font-size:12.5px;color:var(--ink2);
  background:color-mix(in srgb,var(--acc) 7%,transparent);border-radius:0 12px 12px 0}
.explain.fault{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.klabel{font:600 9px var(--fm);letter-spacing:.2em;color:var(--mut);text-transform:uppercase}
.q-note{font:600 10.5px var(--fm);letter-spacing:.08em;color:var(--warn);margin-bottom:12px}
.fix-controls{display:flex;align-items:center;gap:14px;margin:12px 0}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;
  border:1px solid var(--line);margin-bottom:6px;font-size:12px;border-radius:11px}
.tstatus{font:700 9.5px var(--fm);letter-spacing:.12em;color:var(--mut)}
.tstatus.pass{color:var(--acc)} .tstatus.fail{color:var(--bad)}
.out-mini{min-height:56px;max-height:150px;overflow:auto;margin-top:10px;color:var(--mut);font-size:11.5px}
.dg{width:100%;height:auto;display:block}
.dg-edge{stroke:rgba(255,255,255,.16);stroke-width:1.5}
.dg-node rect{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.22);stroke-width:1.5;cursor:pointer;transition:.15s}
.dg-node:hover rect{stroke:#37E39B}
.dg-node.sel rect{stroke:#37E39B;stroke-width:2}
.dg-node.ok rect{stroke:#37E39B;stroke-width:2;fill:rgba(55,227,155,.16)}
.dg-node.bad rect{stroke:#FF4D6E;stroke-width:2;fill:rgba(255,77,110,.14)}
.dg-t{fill:#DCE8E3;font:600 11px var(--fm);text-anchor:middle}
.dg-s{fill:#74857e;font:400 9px var(--fm);text-anchor:middle;letter-spacing:.06em}
.res-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.res-score{font:800 42px/1 var(--fd);color:var(--acc)}
.res-row{border:1px solid var(--line);padding:15px;margin-bottom:10px;border-radius:16px;background:var(--flat)}
.res-row.r-bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.res-v{font:700 10px var(--fm);letter-spacing:.14em}
.res-v.v-ok{color:var(--acc)}.res-v.v-bad{color:var(--bad)}
.cfg-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.cfg-row:hover{background:var(--flat)}
.cfg-row.on{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.cfg-code{color:var(--acc);font:600 9.5px var(--fm);letter-spacing:.12em;width:78px;flex-shrink:0}
.exam-timer{font:800 22px var(--fd);color:var(--warn);letter-spacing:.03em;min-width:88px;text-align:right}
.exam-timer.low{color:var(--bad);animation:tpulse .5s steps(2,end) infinite}
@keyframes tpulse{50%{opacity:.4}}

/* ============ QUESTS ============ */
.quest-row{display:flex;align-items:center;gap:18px;padding:18px;border-bottom:1px solid var(--line)}
.quest-row:last-child{border:0}
.q-idx{font:800 26px var(--fd);color:var(--line2);width:54px;flex-shrink:0;text-align:center}

<script>
(function(){
  function killSplash(){
    var s=document.getElementById('splash');
    if(s){ s.style.animation='none'; s.style.transition='opacity .35s'; s.style.opacity='0';
      s.style.pointerEvents='none'; setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); },400); }
  }
  window.__prismKillSplash = killSplash;
  window.__prismFault = function(msg){
    killSplash();
    var box=document.getElementById('toasts');
    if(box && !box.children.length){
      var d=document.createElement('div');
      d.className='toast t-bad on';
      d.textContent='SCRIPT FAULT :: ' + (msg || 'unknown');
      box.appendChild(d);
    }
    if(window.console && console.error) console.error(msg);
  };
  window.addEventListener('error', function(e){
    if(e && (e.message || (e.filename && !e.target))) window.__prismFault(e.message || 'script load failure');
  });
  var sp=document.getElementById('splash');
  if(sp) sp.addEventListener('click', killSplash);
  setTimeout(killSplash, 2400);
})();
</script>

function accUpsert(acc){

  reg.users=reg.users.map(function(a){ if(String(a.u).toLowerCase()===k){ hit=true; return acc; } return a; });
  if(!hit) reg.users.push(acc);
  accWrite(reg);
}
function accRemove(u){
  var k=String(u).toLowerCase(), reg=accAll();
  reg.users=reg.users.filter(function(a){ return String(a.u).toLowerCase()!==k; });
  accWrite(reg); lsDel(stateKey(u));
}
/* Salted SHA-256. This keeps vaults separated on a shared machine — it is not
   a server-side auth boundary, and anyone with the device can read local storage. */
function randSalt(){
  var b=new Uint8Array(8), s='';
  try{ if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(b); }catch(e){}
  for(var i=0;i<8;i++) s+=('0'+(b[i]||Math.floor(Math.random()*256)).toString(16)).slice(-2);
  return s;
}
function weakDigest(s){
  var h1=0x811c9dc5>>>0, h2=0x1000193>>>0;
  for(var i=0;i<s.length;i++){
    h1=Math.imul(h1^s.charCodeAt(i),0x01000193)>>>0;
    h2=Math.imul(h2+s.charCodeAt(i)*(i+7),0x85ebca6b)>>>0;
  }
  return ('00000000'+h1.toString(16)).slice(-8)+('00000000'+h2.toString(16)).slice(-8);
}
function hashPass(pw,salt){
  return new Promise(function(res){
    var msg='prism$'+salt+'$'+pw;
    try{
      if(window.crypto&&crypto.subtle&&crypto.subtle.digest&&window.TextEncoder){
        crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg)).then(function(buf){
          var out=''; new Uint8Array(buf).forEach(function(b){ out+=('0'+b.toString(16)).slice(-2); });
          res('s256:'+out);
        },function(){ res('fnv:'+weakDigest(msg)); });
        return;
      }
    }catch(e){}
    res('fnv:'+weakDigest(msg));
  });
}
function hydrate(raw){
  var d=DEFAULTS();
  if(!raw||typeof raw!=='object') return d;
  var proj=Object.assign(d.project,raw.project||{});
  var synd=Object.assign(d.syndicate,raw.syndicate||{});
  var s=Object.assign(d,raw);
  s.project=proj; s.syndicate=synd;
  return s;
}
function loadAccount(u){
  ACTIVE=u;
  var raw=null;
  try{ raw=JSON.parse(lsGet(stateKey(u))); }catch(e){}
  state=hydrate(raw);
  state.callsign=u;
  lsSet(SESS_LS,u);
  save();
}
/* A vault written before accounts existed: folded into the first account created. */
function legacyVault(){
  try{
    var raw=JSON.parse(lsGet(LS));
    if(raw&&typeof raw==='object'&&(raw.xp>0||raw.callsign||(raw.mastery&&Object.keys(raw.mastery).length))) return raw;
  }catch(e){}
  return null;
}
function claimLegacy(u){
  var raw=legacyVault(); if(!raw) return false;
  raw.callsign=u;
  lsSet(stateKey(u),JSON.stringify(raw));
  lsDel(LS);
  return true;
}
function signUp(u,pw,cb){
  if(!/^[A-Za-z0-9_\-]{3,16}$/.test(u)) return cb('HANDLE :: 3–16 CHARS · LETTERS / NUMBERS / _ / -');
  if(accFind(u)) return cb('HANDLE TAKEN :: PICK ANOTHER');
  if(String(pw).length<6) return cb('PASSPHRASE :: 6 CHARACTERS MINIMUM');
  var salt=randSalt();
  hashPass(pw,salt).then(function(h){
    accUpsert({u:u,salt:salt,hash:h,created:Date.now(),
      sum:{xp:0,mastery:0,year:12,quests:0,faults:0,seen:Date.now()}});
    var claimed=claimLegacy(u);
    loadAccount(u);
    cb(null,claimed);
  });
}
function signIn(u,pw,cb){
  var a=accFind(u);
  if(!a) return cb('NO SUCH OPERATOR :: CHECK THE HANDLE OR CREATE AN ACCOUNT');
  hashPass(pw,a.salt).then(function(h){
    if(h!==a.hash) return cb('PASSPHRASE REJECTED');
    loadAccount(a.u);
    cb(null);
  });
}
function signOut(prefill){
  if(ACTIVE) save();
  ACTIVE=null; lsDel(SESS_LS);
  state=DEFAULTS();
  EXAM=null; QVIEW=null;
  if(synTimer){ clearInterval(synTimer); synTimer=null; }
  closeModal();
  $('#view').innerHTML=''; $('#bar').innerHTML=''; $('#dock').innerHTML='';
  showGate('in',prefill);
}
var syncT=null;
function save(){
  if(!ACTIVE) return;
  try{ lsSet(stateKey(ACTIVE),JSON.stringify(state)); }catch(e){}
  var a=accFind(ACTIVE);
  if(a){
    a.sum={xp:state.xp,mastery:integrity(),year:state.year,
      quests:Object.keys(state.quests).filter(function(k){ return state.quests[k]; }).length,
      faults:state.diag.length,seen:Date.now()};
    accUpsert(a);
  }
  var d=$('#sync-dot');
  if(d){ d.classList.add('busy'); clearTimeout(syncT); syncT=setTimeout(function(){ d.classList.remove('busy'); },700); }
}

function typewrite(el,text,speed){
  speed=speed||13;
  return new Promise(function(res){
    var i=0,skipped=false;
    el.textContent=''; el.onclick=function(){ skipped=true; };
    var t=setInterval(function(){
      if(skipped||i>=text.length){ clearInterval(t); el.textContent=text; el.onclick=null; res(); return; }
      el.textContent=text.slice(0,++i);
    },speed);
  });
}
function countUp(el,to,dur,prefix){
  dur=dur||900; prefix=prefix||'';
  var t0=performance.now();
  function step(t){
    var k=Math.min(1,(t-t0)/dur);
    el.textContent=prefix+Math.round(to*(k*(2-k))).toLocaleString();
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function hlLine(line,lang){

  var KWPY=/^(def|return|if|elif|else|while|for|in|and|or|not|is|break|continue|pass|try|except|finally|raise|as|class|True|False|None|self|print|len|range|str|int|float|bool|list|abs|sum|max|min|sorted|round|chr|ord|any|all|enumerate|reversed|isinstance|append|pop|sort|reverse|insert|remove|extend|copy|clear|index|count|upper|lower|strip|lstrip|rstrip|split|join|replace|find|startswith|endswith|isdigit|isascii|isalpha|isalnum|capitalize|title)$/;
  var KWSQL=/^(select|distinct|as|from|join|inner|left|outer|on|where|and|or|not|in|between|is|null|like|group|by|having|order|asc|desc|limit|offset|count|sum|avg|min|max|upper|lower|length|round|abs)$/;

    if(e.k==='fn') return e.name.toUpperCase()+'('+(e.star?'*':(e.args||[]).map(labelOfExpr).join(', '))+')';
    return 'expr';
  }
  var labels=[], starCols=null;
  ast.items.forEach(function(it){
    if(it.expr.k==='star'){
      var list=[];
      srcs.forEach(function(s){
        if(it.expr.qual&&s.alias!==it.expr.qual) return;
        s.cols.forEach(function(c){ list.push({src:'star',col:c,table:s.alias}); });
      });
      if(it.expr.qual&&!list.length) throw new Error('unknown table or alias: '+it.expr.qual);
      list.forEach(function(sc){ labels.push(sc.col); starCols=starCols||[]; starCols.push(sc); });
    } else {
      labels.push(it.alias||labelOfExpr(it.expr));
      starCols=starCols||[]; starCols.push(null);
    }
  });
  function project(u){
    var row=[];
    ast.items.forEach(function(it,i){
      if(it.expr.k==='star'){
        var ctx=u.rows[0];
        srcs.forEach(function(s){
          if(it.expr.qual&&s.alias!==it.expr.qual) return;
          s.cols.forEach(function(c){ row.push(ctx?((s.alias in ctx.byAlias)?ctx.byAlias[s.alias][c]:null):null); });
        });
      } else {
        row.push(grouped?evG(it.expr,u):evSc(it.expr,u.rows[0]));
      }
    });
    return row;
  }
  var aliasMap={};
  ast.items.forEach(function(it,i){ if(it.alias) aliasMap[it.alias]=i; });
  var rowsOut=units.map(function(u){ return {row:project(u),u:u}; });
  /* ordering */
  function cmpV(a,b){
    if(a===null&&b===null) return 0;
    if(a===null) return -1;
    if(b===null) return 1;
    if(typeof a==='number'&&typeof b==='number') return a-b;
    var A=String(a), B=String(b);
    return A<B?-1:(A>B?1:0);
  }
  if(ast.orderBy.length){
    rowsOut.forEach(function(ro){
      ro.keys=ast.orderBy.map(function(o){
        var e=o.expr;
        if(e.k==='col'&&!e.qual&&(e.col in aliasMap)) return ro.row[aliasMap[e.col]];
        return grouped?evG(e,ro.u):evSc(e,ro.u.rows[0]);
      });
    });
    var idxs=rowsOut.map(function(_,i){ return i; });
    idxs.sort(function(a,b){
      var A=rowsOut[a], B=rowsOut[b];
      for(var i=0;i<ast.orderBy.length;i++){
        var c=cmpV(A.keys[i],B.keys[i]);
        if(ast.orderBy[i].dir==='DESC') c=-c;
        if(c!==0) return c;
      }
      return 0;
    });
    rowsOut=idxs.map(function(i){ return rowsOut[i]; });
  }
  var result=rowsOut.map(function(ro){ return ro.row; });
  if(ast.distinct){
    var seen=Object.create(null), dedup=[];
    result.forEach(function(r){
      var k=JSON.stringify(r.map(function(v){ return (typeof v==='number')?(Math.round(v*1e9)/1e9):v; }));
      if(!seen[k]){ seen[k]=1; dedup.push(r); }
    });
    result=dedup;
  }
  if(ast.offset) result=result.slice(ast.offset);
  if(ast.limit!==null&&ast.limit!==undefined) result=result.slice(0,ast.limit);
  return {cols:labels,rows:result};
}
/* ---------------- rendering + public runners ---------------- */
function sqlRender(cols,rows,maxShow){
  maxShow=maxShow||40;
  function fmt(v){
    if(v===null) return 'NULL';
    if(typeof v==='number'){
      if(Number.isInteger(v)) return String(v);
      return String(parseFloat(v.toFixed(6)));
    }
    return String(v);
  }
  var cells=rows.map(function(r){ return r.map(fmt); });
  var w=cols.map(function(c,i){
    var m=String(c).length;
    cells.forEach(function(r){ if(r[i].length>m) m=r[i].length; });
    return Math.min(m,30);
  });
  function pad(x,n){ return x.length>n?x.slice(0,n-1)+'…':x+' '.repeat(n-x.length); }
  var out=[cols.map(function(c,i){ return pad(String(c),w[i]); }).join(' | ')];
  out.push(w.map(function(n){ return '-'.repeat(n); }).join('-+-'));
  cells.slice(0,maxShow).forEach(function(r){ out.push(r.map(function(c,i){ return pad(c,w[i]); }).join(' | ')); });
  if(rows.length>maxShow) out.push('… '+(rows.length-maxShow)+' more row(s) not shown');
  out.push('('+rows.length+' row'+(rows.length===1?'':'s')+')');
  return out;
}
function now(){ return (typeof performance!=='undefined'&&performance.now)?performance.now():Date.now(); }
function runSQL(q,db){
  db=db||SQL_DB;
  var t0=now(), logs=[], last=null, error=null;
  try{
    var asts=sqlParseAll(q);
    if(!asts.length) throw new Error('empty statement — start with SELECT');
    asts.forEach(function(ast,i){
      var r=sqlExecAST(ast,db);
      if(i) logs.push('');
      logs.push.apply(logs,sqlRender(r.cols,r.rows));
      last=r;
    });
  }catch(e){ error=String(e.message||e); logs.push(':: SQL ERROR :: '+error); }
  return {logs:logs,rows:last?last.rows:null,cols:last?last.cols:null,ms:Math.max(1,Math.round(now()-t0)),error:error};
}
function sqlNormCell(v){ return (typeof v==='number')?(Math.round(v*1e9)/1e9):v; }
function sqlRowsEq(got,exp,unordered){
  got=(got||[]).map(function(r){ return r.map(sqlNormCell); });
  exp=(exp||[]).map(function(r){ return r.map(sqlNormCell); });
  if(got.length!==exp.length) return false;
  var g=got.map(function(r){ return JSON.stringify(r); });
  var e2=exp.map(function(r){ return JSON.stringify(r); });
  if(unordered){ g.sort(); e2.sort(); }
  return g.every(function(x,i){ return x===e2[i]; });
}
function sqlRunTests(q,tests,db){
  var res=runSQL(q,db);
  var r=[], e=[];
  (tests||[]).forEach(function(t){
    if(res.error){ r.push(false); e.push(res.error); return; }
    var ok=sqlRowsEq(res.rows,(t.expect&&t.expect.rows)||[],!!(t&&t.unordered));
    r.push(ok);
    if(!ok){
      var got=(res.rows||[]).map(function(x){ return JSON.stringify(x); }).join('  ');
      var want=((t.expect&&t.expect.rows)||[]).map(function(x){ return JSON.stringify(x); }).join('  ');
      e.push('got ['+got+'] · expected ['+want+']');
    }
  });
  return {logs:res.logs,tests:tests?{r:r,e:e}:null,ms:res.ms,error:res.error};
}

/* ================================================================
   EXAM ENGINE — five timing regimes:

   +50% SPEED BONUS for fast correct answers in train mode)

var EXAM=null, QVIEW=null;
function timingChip(ex){
  if(ex.perQ) return (ex.perQ<=20?'LIGHTNING':'SPRINT')+' · '+ex.perQ+'s/Q';
  if(ex.deadline) return 'TIMED · '+ex.timedMin+' MIN';
  return 'UNTIMED';
}
function startExam(o){
  EXAM={qs:o.qs,meta:o,i:0,ans:{},rec:{},code:{},feedback:!!o.feedback,award:o.award!==false,
    deadline:o.timed?Date.now()+o.timed*60000:0,timedMin:o.timed||0,
    perQ:o.perQ||0,qDeadline:0,qStart:Date.now(),speedBonus:!!o.speedBonus,submitted:false};
  EXAM.meta.startedAt=Date.now();
  renderExamQ();
}
function examTick(){
  if(!EXAM||EXAM.submitted) return;
  if(EXAM.deadline){
    var left=EXAM.deadline-Date.now(), el=$('#ex-timer');
    if(el) el.textContent=fmtTime(Math.max(0,left));
    if(left<=0){ toast('TIME EXPIRED :: auto-submitting','warn'); submitExam(); return; }
  }
  if(EXAM.perQ&&EXAM.qDeadline){
    var ql=EXAM.qDeadline-Date.now(), qel=$('#ex-qtimer');
    if(qel){ qel.textContent=String(Math.max(0,Math.ceil(ql/1000)));
      if(ql<=10000) qel.classList.add('low'); }
    if(ql<=0) onQTimeout();
  }
}
function onQTimeout(){
  if(!EXAM||EXAM.submitted) return;
  var q=EXAM.qs[EXAM.i];
  EXAM.qDeadline=0;
  var qel=$('#ex-qtimer');
  if(qel){ qel.textContent='0'; qel.classList.add('low'); }
  if(EXAM.rec[q.id]===undefined){
    toast('TIME EXPIRED :: '+(EXAM.feedback?'FAULT LOGGED':'QUESTION SKIPPED'),'warn');
    recordAnswer(q,false);
    if(EXAM.feedback){
      var body=$('#ex-body');
      if(body) applyGradeUI(q,body);
      showExplain(q,false);
    }
  }
  setTimeout(function(){
    if(!EXAM||EXAM.submitted) return;
    if(EXAM.i<EXAM.qs.length-1){ EXAM.i++; renderExamQ(); }
    else submitExam();
  },EXAM.feedback?1600:450);
}
function renderExamQ(){

   '<div class="g gpad" style="margin-bottom:14px">'+
   '<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">'+

   '<div style="font:700 17px var(--fd)">Question '+(EXAM.i+1)+' / '+total+'</div></div>'+
   '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
   (EXAM.deadline?'<div class="exam-timer" id="ex-timer" title="total time">--:--</div>':'')+
   (EXAM.perQ?'<div class="exam-timer" id="ex-qtimer" title="this question">--</div>':'')+
   '<span class="chip">'+(EXAM.feedback?'TRAIN':'MOCK')+'</span>'+
   '<span class="chip chip-acc">'+timingChip(EXAM)+'</span>'+
   '<button class="btn btn-sm" id="ex-abort">'+(EXAM.meta.questCtx?'ABANDON':'DISCARD')+'</button></div></div>'+
   '<div class="meter" style="margin-top:14px;max-width:280px"><i style="width:'+Math.round(EXAM.i/total*100)+'%"></i></div></div>'+
   '<div id="ex-q"></div>'+
   '<div style="display:flex;justify-content:space-between;margin-top:20px">'+
   '<button class="btn" id="ex-prev">‹ PREV</button>'+
   '<button class="btn btn-acc" id="ex-next">'+(last?(EXAM.feedback?'FINISH':'SUBMIT'):'NEXT ›')+'</button></div>');
  $('#ex-abort').onclick=function(){ EXAM=null; QVIEW=null;
    if(state.view==='quests') renderView(); else navigate('exam'); };
  $('#ex-prev').onclick=function(){ if(EXAM.i>0){ EXAM.i--; renderExamQ(); } };
  $('#ex-next').onclick=function(){
    if(EXAM.i<total-1){ EXAM.i++; renderExamQ(); } else submitExam();
  };
  if(EXAM.feedback){
    var a=EXAM.ans[q.id]||{};
    var answered=(q.type==='fix')?(a.pass===true):(q.type==='diagram'?(a.node!=null):(a.choice!=null));
    $('#ex-next').disabled=!(answered&&(EXAM.rec[q.id]!==undefined||q.type==='fix'));
  }
  renderQBody(q);
  /* per-question clock: only runs while the question is unanswered */
  EXAM.qStart=Date.now();
  if(EXAM.perQ){
    if(EXAM.rec[q.id]!==undefined){
      EXAM.qDeadline=0;
      var qt=$('#ex-qtimer'); if(qt){ qt.textContent='—'; qt.classList.remove('low'); }
    } else {
      EXAM.qDeadline=EXAM.qStart+EXAM.perQ*1000;
    }
  }
  refreshIcons();
}
function wireHints(holder,hints){
  if(!holder||!hints||!hints.length) return;
  var shown=0;
  holder.innerHTML='<button class="btn btn-acc" id="hint-btn">'+iconHtml('zap')+' REVEAL HINT</button>';
  var btn=holder.querySelector('#hint-btn');
  btn.onclick=function(){
    if(shown>=hints.length) return;
    var d=document.createElement('div');
    d.style.cssText='margin:10px 0;padding:10px 12px;border-left:3px solid var(--acc);background:rgba(14,138,104,.08);border-radius:0 10px 10px 0;font-size:12.5px;line-height:1.7;color:var(--ink)';
    d.innerHTML='<span class="klabel" style="color:var(--acc)">HINT '+(shown+1)+' / '+hints.length+'</span><br>'+esc(hints[shown]);
    holder.insertBefore(d,btn);
    shown++;
    if(shown>=hints.length){ btn.disabled=true; btn.style.opacity=.5; btn.innerHTML=iconHtml('zap')+' ALL HINTS SHOWN'; }
  };
}

function applyGradeUI(q,body){

  if(q.type==='diagram'){
    var ans=DIAGRAMS[q.diag].answer;
    body.querySelectorAll('.dg-node').forEach(function(g){
      if(g.dataset.node===ans) g.classList.add('ok');

    });
  } else {
    body.querySelectorAll('.opt').forEach(function(x){
      var i=+x.dataset.i;
      if(i===q.answer) x.classList.add('ok');
      if(a.choice===i&&i!==q.answer) x.classList.add('bad');
    });
  }

function showExplain(q,ok){

function paintFixResult(q,res){
  var rows=$$('#ex-tests .trow'), T=res.tests;
  if(!T){ rows.forEach(function(r){ r.querySelector('.tstatus').textContent='NO TESTS'; }); return; }
  T.r.forEach(function(ok,i){
    var st=rows[i]&&rows[i].querySelector('.tstatus');
    if(!st) return;
    st.textContent=ok?'PASS':'FAIL';
    st.className='tstatus '+(ok?'pass':'fail');
    if(!ok&&T.e[i]) st.textContent='FAIL · '+String(T.e[i]).slice(0,60);
  });
  var out=$('#ex-out');
  if(out) out.textContent=(res.logs.length?res.logs.join('\n'):':: no console output ::')+'\n:: '+res.ms+'ms';
  if(T.r.every(Boolean)){
    if(!EXAM.ans[q.id]||EXAM.ans[q.id].pass!==true){
      EXAM.ans[q.id]={pass:true};
      if(!EXAM.rec[q.id]){
        recordAnswer(q,true); showExplain(q,true);
        toast('ALL TESTS GREEN :: question banked','ok');
      }
    }
    var nx=$('#ex-next'); if(nx) nx.disabled=false;
  }

function recordAnswer(q,ok){
  if(EXAM.rec[q.id]!==undefined) return;

  var qel=$('#ex-qtimer');
  if(qel){ qel.textContent='—'; qel.classList.remove('low'); }
  recordMastery(q.dots,ok);
  if(ok&&EXAM.award&&q.xp) awardXP(q.xp,'CORRECT :: '+dotCode(q.dots[0]));
  /* SPEED BONUS: correct within half the per-question budget, train mode */
  if(ok&&EXAM.feedback&&EXAM.speedBonus&&EXAM.perQ&&EXAM.qStart&&q.xp){
    if(Date.now()-EXAM.qStart<=EXAM.perQ*500){
      var bonus=Math.max(5,Math.round(q.xp*0.5));
      (function(b){ setTimeout(function(){ awardXP(b,'SPEED BONUS :: '+dotCode(q.dots[0])); },700); })(bonus);
    }
  }
  if(!ok) logFault(q.dots,EXAM.meta.title||'DRILL');

async function submitExam(){
  if(!EXAM||EXAM.submitted) return;
  EXAM.submitted=true; EXAM.qDeadline=0;
  var pend=EXAM.qs.filter(function(q){ return EXAM.rec[q.id]===undefined; });
  if(pend.length) mount('<div class="g gpad"><div class="empty">GRADING PATCHES…</div></div>');
  for(var i=0;i<pend.length;i++){
    var q=pend[i];
    if(q.type==='fix'){
      var code=EXAM.code[q.id]||q.starter;
      var res=(q.lang==='sql')?sqlRunTests(code,q.tests,q.db):pyRunTests(code,q.tests);
      EXAM.ans[q.id]={code:code,pass:!!(res.tests&&res.tests.r.every(Boolean))};
      recordAnswer(q,EXAM.ans[q.id].pass);
    } else {
      var a=EXAM.ans[q.id]||{};
      var ok=(q.type==='diagram')?(a.node===DIAGRAMS[q.diag].answer):(a.choice===q.answer);
      EXAM.ans[q.id]=Object.assign(a,{ok:ok});
      recordAnswer(q,ok);
    }
  }
  var correct=EXAM.qs.filter(function(q){ return EXAM.rec[q.id]===true; }).length;
  var s={correct:correct,total:EXAM.qs.length,qs:EXAM.qs,rec:EXAM.rec,ans:EXAM.ans,meta:EXAM.meta};
  s.earned=s.qs.reduce(function(acc,q){ return acc+((s.rec[q.id]===true&&q.xp)?q.xp:0); },0);
  s.timeUsed=s.meta.startedAt?Math.max(0,Date.now()-s.meta.startedAt):0;
  EXAM=null;
  if(s.meta.onFinish){ s.meta.onFinish(s); return; }
  renderExamResults(s);
}

    };
  });

function sbOut(line,cls){
  var o=$('#sb-out'); if(!o) return;
  var d=document.createElement('div');
  d.className='tl'+(cls?(' '+cls):'');
  d.textContent=line;
  o.appendChild(d);
  o.scrollTop=o.scrollHeight;
}
function sbRun(){
  if(!SBED) return;
  var code=SBED.value;
  state.sandboxCode[sbLang]=code; save();
  sbOut('prism('+sbLang+')> execute','dim');
  var res;
  if(sbLang==='sql'){ res=runSQL(code); if(!res.error&&!res.rows) sbOut('(no statement)','dim'); }
  else res=runPY(code);
  if(res.logs.length) res.logs.forEach(function(l){ sbOut(l); });
  else sbOut(sbLang==='sql'?':: no rows':':: no output — did you print()?','dim');
  var fault=res.logs.some(function(l){ return /ERROR|Error|UNCAUGHT/.test(l); });
  sbOut(':: exit '+(fault?1:0)+' :: '+res.ms+'ms','sys');
  if(!state.sandboxAchieved){ state.sandboxAchieved=true; awardXP(15,'FIRST EXECUTION'); }
}
document.addEventListener('keydown',function(e){

function lastSeen(t){

  var d=Date.now()-t;

  if(d<36e5) return Math.round(d/6e4)+'M AGO';
  if(d<864e5) return Math.round(d/36e5)+'H AGO';
  return Math.round(d/864e5)+'D AGO';

function lbRowHtml(x,i){
  var rk=rankOf(x.xp), nx=RANKS[rk.i+1];
  var pct=nx?Math.min(100,Math.round((x.xp-rk.xp)/(nx.xp-rk.xp)*100)):100;
  return '<div class="lb-rank'+(x.me?' me':'')+(i<3?' p'+(i+1):'')+'">'+
   '<span class="lb-ps">'+(i+1)+'</span>'+
   '<span class="acc-av">'+esc(x.name.slice(0,1).toUpperCase())+'</span>'+
   '<div class="lb-id"><div class="lb-cs">'+
     '<span class="ig-on'+(x.on?' on':'')+'" title="'+lastSeen(x.seen)+'"></span>'+esc(x.name)+
     (x.me?'<span class="chip chip-acc">YOU</span>':'')+
     (x.sim?'<span class="tag-sim">SIM</span>':'')+'</div>'+
    '<div class="lb-rk">'+rk.name+' · '+x.mastery+'% MASTERY · '+x.quests+' SECTORS</div></div>'+
   '<div class="lb-prog"><div class="meter"><i style="width:'+pct+'%"></i></div>'+
    '<div class="lb-rk" style="margin-top:5px">'+(nx?(nx.xp-x.xp).toLocaleString()+' TO NEXT RANK':'MAX RANK')+'</div></div>'+
   '<div class="lb-xp"><b>'+x.xp.toLocaleString()+'</b><span>XP</span></div></div>';
}
function renderLeaderboard(){
  var rows=ladderRows();
  var pos=-1;
  rows.forEach(function(x,i){ if(x.me) pos=i; });
  var above=pos>0?rows[pos-1]:null;
  var r=rankOf(state.xp), nxt=RANKS[r.i+1];
  var pct=nxt?Math.min(100,Math.round((state.xp-r.xp)/(nxt.xp-r.xp)*100)):100;
  var pool=RIVALS.map(function(x){ return {name:x.name,pool:x.pool,me:false}; })
    .concat([{name:state.syndicate.name,pool:state.syndicate.pool,me:true}])
    .sort(function(a,b){ return b.pool-a.pool; });
  var board=(lbTab==='ops')
    ? rows.map(lbRowHtml).join('')
    : pool.map(function(x,i){
        return '<div class="lb-rank'+(x.me?' me':'')+(i<3?' p'+(i+1):'')+'">'+
         '<span class="lb-ps">'+(i+1)+'</span>'+
         '<span class="acc-av">'+iconHtml('users')+'</span>'+
         '<div class="lb-id"><div class="lb-cs">'+esc(x.name)+(x.me?'<span class="chip chip-acc">YOUR CREW</span>':'')+'</div>'+
         '<div class="lb-rk">POOLED XP ACROSS THE ROSTER</div></div>'+
         '<div class="lb-xp"><b>'+x.pool.toLocaleString()+'</b><span>POOL</span></div></div>';
      }).join('');
  mount(
  '<div class="vhead"><div class="v-kick">OPERATOR LADDER · THIS DEVICE + SYNDICATE NET</div>'+
  '<div class="v-title">Leaderboard</div></div>'+
  '<div class="lb-grid"><div>'+
   '<div class="g gpad"><div class="sec-h"><span>'+(lbTab==='ops'?'Operators':'Syndicates')+'</span>'+
    '<span class="rt"><span class="seg">'+
     '<button id="lb-ops"'+(lbTab==='ops'?' class="on"':'')+'>OPERATORS</button>'+
     '<button id="lb-syn"'+(lbTab==='syn'?' class="on"':'')+'>SYNDICATES</button></span></span></div>'+
    board+
    (lbTab==='ops'?'<div style="color:var(--mut);font-size:11px;margin-top:14px">'+
     'Accounts registered in this browser rank alongside the syndicate net. Entries marked SIM are the simulated study group.</div>':'')+
   '</div>'+
  '</div><div>'+
   '<div class="g gpad" style="margin-bottom:16px"><div class="sec-h"><span>Your standing</span></div>'+
    '<div class="lb-you"><b>'+(pos>=0?'#'+(pos+1):'—')+'</b><span>OF '+rows.length+' OPERATORS</span></div>'+
    '<div class="meter" style="height:8px"><i style="width:'+pct+'%"></i></div>'+
    '<div class="lb-rk" style="margin-top:8px">'+r.name+' → '+(nxt?nxt.name:'MAX RANK')+' · '+pct+'%</div>'+
    '<div class="mm-row" style="margin-top:12px"><span class="mm-code">XP</span>'+
     '<span style="flex:1;font-weight:700">'+state.xp.toLocaleString()+'</span>'+
     '<span class="mm-pct">'+(nxt?('+'+(nxt.xp-state.xp).toLocaleString()):'MAX')+'</span></div>'+
    '<div class="mm-row"><span class="mm-code">MASTERY</span>'+
     '<span style="flex:1;font-weight:700">'+integrity()+'%</span><span class="mm-pct">AVG</span></div>'+
    '<div class="mm-row"><span class="mm-code">AHEAD</span>'+
     '<span style="flex:1;font-weight:700">'+(above?esc(above.name):'nobody — top of the ladder')+'</span>'+
     '<span class="mm-pct">'+(above?('+'+(above.xp-state.xp).toLocaleString()):'—')+'</span></div>'+
    (above?('<div style="color:var(--ink2);font-size:12px;margin-top:12px">Bank '+
      (above.xp-state.xp+1).toLocaleString()+' XP to take position #'+pos+'.</div>')
     :'<div style="color:var(--ink2);font-size:12px;margin-top:12px">Nobody on this board is ahead of you. Hold the line.</div>')+
   '</div>'+
   '<div class="g gpad"><div class="sec-h"><span>Rank ladder</span><span class="rt">XP REQUIRED</span></div>'+
   RANKS.map(function(x,i){
     var cl=state.xp>=x.xp, on=(i===r.i);
     var step=i?(x.xp-RANKS[i-1].xp):0;
     return '<div class="tier'+(cl?' cl':'')+(on?' on':'')+'"><span class="tier-d"></span>'+
     '<span class="tier-n">'+x.name+'</span>'+
     '<span class="tier-x">'+x.xp.toLocaleString()+(step?(' · +'+step.toLocaleString()):'')+'</span></div>';
   }).join('')+
   '<div style="color:var(--mut);font-size:11px;margin-top:10px">Every promotion costs more than the last — '+
   (RANKS[1].xp-RANKS[0].xp).toLocaleString()+' XP for the first, '+
   (RANKS[RANKS.length-1].xp-RANKS[RANKS.length-2].xp).toLocaleString()+' XP for the last.</div></div>'+
  '</div></div>');
  $('#lb-ops').onclick=function(){ lbTab='ops'; renderLeaderboard(); };
  $('#lb-syn').onclick=function(){ lbTab='syn'; renderLeaderboard(); };
  refreshIcons();
}

/* ================================================================
   VIEW :: INSIGHTS
================================================================ */
function renderInsights(){
  var mods=SYLLABUS[state.year].modules;
  var faults=state.diag.slice(-40).reverse();
  var weak=weakDots();
  var logLines=[
   '> diagnostics --operator='+(state.callsign||'GUEST-01')+' --scope=dotpoint --year='+state.year,
   'scanning '+Object.keys(DOT_INDEX).length+' monitored dot points across '+mods.length+' focus areas …',
   'faults on record: '+state.diag.length];
  faults.slice(0,22).forEach(function(f){
    var sc=state.mastery[f.dot]?state.mastery[f.dot].score:'?';
    logLines.push('  ['+new Date(f.t).toTimeString().slice(0,5)+'] FAULT '+dotCode(f.dot)+' :: scored '+sc+'% :: '+esc(f.ctx));
  });
  if(!faults.length) logLines.push('  no faults logged — clean runs only');
  if(weak.length) logLines.push('ADVISORY :: weakest dot point '+dotCode(weak[0])+' at '+state.mastery[weak[0]].score+'%');
  else logLines.push('ADVISORY :: no critical gaps in Year '+state.year+' stream');
  logLines.push('SYSTEM INTEGRITY: '+integrity()+'% _');
  mount(
  '<div class="vhead"><div class="v-kick">DOT-POINT ANALYTICS · MASTERY DECAY MODEL</div>'+
  '<div class="v-title">Insights</div></div>'+
  '<div class="g gpad" style="margin-bottom:16px"><div class="hero-in">'+
  '<div class="ringwrap">'+ringSVG(integrity(),116,integrity()+'%')+'</div>'+
  '<div style="flex:1;min-width:230px"><div class="hi-rank">'+(integrity()>=75?'Nominal':(integrity()>=50?'Degraded':'Critical'))+' integrity</div>'+
  '<div class="hi-sub">Exponentially-weighted mastery across every attempted dot point in Year '+state.year+'. Faults decay the score; clean answers recover it.</div>'+
  '<div class="frow" style="margin-top:8px;align-items:flex-start">'+
  (weak.length?('<button class="btn btn-acc" id="in-drill">'+iconHtml('zap')+' DRILL WEAKEST FOCUS AREA</button>'):'')+
  '<button class="btn" id="in-purge">PURGE FAULT LOG</button></div></div></div></div>'+
  '<div class="g gpad" style="margin-bottom:16px"><div class="sec-h"><span>Diagnostic log</span><span class="rt">LAST '+Math.min(22,faults.length)+' EVENTS</span></div>'+
  '<div class="diag-term">'+logLines.join('\n')+'</div></div>'+
  mods.map(function(m){
    return '<div class="g gpad" style="margin-bottom:16px"><div class="sec-h"><span>'+m.code+' · '+esc(m.title)+'</span>'+
    '<span class="rt"><button class="btn btn-sm" data-drill="'+m.id+'">DRILL</button></span></div>'+
    m.dots.map(function(d){
      var mm=state.mastery[d.id];
      var st=!mm?'NO DATA':(mm.score>=75?'NOMINAL':(mm.score>=50?'DEGRADED':'CRITICAL'));
      return '<div class="dg-mrow"><span class="mm-code">'+dotCode(d.id)+'</span>'+
      '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(d.text)+'</span>'+
      '<div class="meter mm-bar" style="width:120px"><i style="width:'+(mm?mm.score:0)+'%"></i></div>'+
      '<span class="st-chip st-'+st.replace(' ','-')+'">'+st+'</span></div>';
    }).join('')+'</div>';
  }).join(''));
  var drillBtn=$('#in-drill');
  if(drillBtn) drillBtn.onclick=function(){
    var m=mods.find(function(x){ return x.id===DOT_INDEX[weak[0]].modId; });
    startModuleDrill(m);
  };
  $('#in-purge').onclick=function(){ state.diag=[]; save(); renderInsights(); toast('FAULT LOG PURGED'); };
  $$('[data-drill]').forEach(function(b){
    b.onclick=function(){ var m=mods.find(function(x){ return x.id===b.getAttribute('data-drill'); }); startModuleDrill(m); };
  });
}

/* ================================================================
   INIT (fault-tolerant)
================================================================ */
function bootApp(){
  try{ document.body.className=(state.year===12)?'night':'day'; }catch(e){ if(window.__prismFault) window.__prismFault(e.message); }
  try{ applyLens(); }catch(e){ if(window.console)console.error(e); }
  try{ paintBar(); }catch(e){ if(window.__prismFault) window.__prismFault('paintBar: '+e.message); }
  try{ paintDock(); }catch(e){ if(window.__prismFault) window.__prismFault('paintDock: '+e.message); }
  try{ renderView(); }catch(e){ if(window.__prismFault) window.__prismFault('renderView: '+e.message); }
  refreshIcons();
}
(function boot(){
  var sess=lsGet(SESS_LS);
  if(sess&&accFind(sess)){ loadAccount(accFind(sess).u); bootApp(); return; }
  try{ applyLens(); }catch(e){}
  showGate();
})();
try{ if(!ssGet('prism-splash')) ssSet('prism-splash','1'); }catch(e){}
setInterval(examTick,500);
setInterval(function(){
  if(!ACTIVE||state.year!==12||Math.random()>0.4) return;
  if(state.view==='syndicate') return;
  var fl=FEED_LINES[Math.floor(Math.random()*FEED_LINES.length)];
  pushTransmission(fl[0],fl[1]);
},52000);
</script>
